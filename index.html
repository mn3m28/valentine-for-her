<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="A playful valentine page for Eman — will you be my valentine?" />
  <title>Eman — Will you be my Valentine?</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{ --bg1:#ffdde1; --bg2:#ffc3a0; --accent:#ff416c; --muted:#545454; --radius:18px; }
    html,body{height:100%;margin:0;font-family:'Cairo',system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
    body{ background: linear-gradient(135deg,var(--bg1),var(--bg2)); display:flex;align-items:center;justify-content:center; padding:24px; }
    .card{ width:min(760px,92vw); background:rgba(255,255,255,0.96); border-radius:calc(var(--radius) + 6px); padding:28px; box-shadow:0 12px 30px rgba(0,0,0,0.12); text-align:center; position:relative; overflow:hidden; }
    h1{ margin:0 0 6px 0; color:var(--accent); font-size:24px; font-weight:800; }
    .question{ font-size:18px; color:#222; margin-bottom:14px; }
    .arabic-name{ font-family:'Amiri', serif; font-size:34px; color:var(--accent); display:block; margin-top:6px; direction:rtl; }
    .buttons{ display:flex; gap:12px; justify-content:center; margin-top:18px; position:relative; }
    /* style both real buttons and the anchor link so it looks like a button */
    button, a.yes { padding:12px 20px; border-radius:12px; border:0; cursor:pointer; font-weight:700; font-size:15px; color:#fff; box-shadow:0 8px 20px rgba(0,0,0,0.08); display:inline-block; text-decoration:none; text-align:center; }
    a.yes:focus, button:focus { outline:3px solid rgba(255,65,108,0.18); outline-offset:3px; }
    .yes{ background:linear-gradient(90deg,var(--accent),#ff6b8a); }
    .no{ background:linear-gradient(90deg,#7b61ff,#9a8bff); position:relative; }
    .note{ margin-top:14px; color:#666; font-size:13px; }

    /* small responsive tweaks */
    @media (max-width:420px){
      h1{font-size:18px}
      .arabic-name{font-size:26px}
      .buttons{flex-direction:column}
      button, a.yes{width:100%;}
    }

    /* floating heart decoration */
    .heart {
      position:absolute; right:-40px; top:-40px; width:160px; height:160px; pointer-events:none; opacity:0.08;
      background:radial-gradient(circle at 30% 30%, #fff 0,#fff0 30%), linear-gradient(135deg,#ff6b8a,#ff416c);
      transform:rotate(45deg);
      border-radius:20px;
      filter:blur(10px);
    }

  </style>
</head>
<body>
  <div class="card" role="main" aria-labelledby="title">
    <div class="heart" aria-hidden="true"></div>
    <h1 id="title">Eman — Will you be my Valentine?</h1>
    <div class="question">Eman, will you be my valentine?<span class="arabic-name" aria-hidden="false">إيمان</span></div>
    <div class="buttons">
      <!-- anchor opens the celebration page; target=_blank opens in a new tab for a pleasant surprise -->
      <a id="yesBtn" class="yes" href="celebrate.html" aria-label="Say yes" target="_blank" rel="noopener">Yes</a>
      <button id="noBtn" class="no" aria-label="Say no">No</button>
    </div>
    <p class="note" aria-hidden="true">Choose one.</p>
  </div>

  <script>
    const yes = document.getElementById('yesBtn');
    const no = document.getElementById('noBtn');
    const card = document.querySelector('.card');

    // No JS needed for yes (anchor handles navigation). We keep focus styles for keyboard users.

    // Make No button move away whenever user tries to press it
    function moveNoButtonAway(){
      const parentRect = card.getBoundingClientRect();
      const btnRect = no.getBoundingClientRect();
      const padding = 8;
      const areaWidth = Math.max(0, parentRect.width - btnRect.width - padding*2);
      const areaHeight = Math.max(0, parentRect.height - btnRect.height - padding*2);
      // Keep button within visible card bounds
      const newLeft = padding + Math.random() * areaWidth;
      const newTop = padding + Math.random() * areaHeight;
      no.style.position = 'absolute';
      no.style.transition = 'left 220ms cubic-bezier(.2,.9,.3,1), top 220ms cubic-bezier(.2,.9,.3,1), transform 160ms ease';
      no.style.left = newLeft + 'px';
      no.style.top = newTop + 'px';
      no.style.transform = 'translateZ(0) rotate(' + (Math.random()*20 - 10) + 'deg)';
    }

    // move on many interaction events so it "runs away" reliably and also support keyboard attempts
    ['mouseenter','pointerenter','pointerdown','mousedown','touchstart','focus','keydown'].forEach(ev => {
      no.addEventListener(ev, (e) => {
        // allow Tab/Shift+Tab navigation to skip trapping users who need keyboard access: only run for Enter/Space or pointer events
        if (ev === 'keydown'){
          if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
          e.preventDefault && e.preventDefault();
        } else {
          e.preventDefault && e.preventDefault();
        }
        e.stopPropagation && e.stopPropagation();
        moveNoButtonAway();
      }, {passive:false});
    });

    // also block click if somehow it was pressed
    no.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      moveNoButtonAway();
    });

    // reset positioning on resize for small screens so buttons stack naturally
    window.addEventListener('resize', () => {
      if (card.clientWidth < 420) {
        no.style.position = '';
        no.style.left = '';
        no.style.top = '';
        no.style.transform = '';
      }
    });
  </script>
</body>
</html>
