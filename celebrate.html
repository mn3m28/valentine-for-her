<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Celebrate 🎉</title>
  <meta name="description" content="A joyful celebration page — Happy Valentine!" />
  <style>
    :root{ --accent:#ff416c; --bg:#fff5f7; }
    html,body{height:100%;margin:0;font-family:system-ui, Arial, sans-serif;background:var(--bg);color:var(--accent);display:flex;align-items:center;justify-content:center;}
    .wrap{text-align:center;padding:24px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.08);background:white;max-width:720px;}
    h1{font-size:28px;margin:0 0 6px}
    p{margin:0;color:#444}
    .confetti{margin-top:18px;font-size:28px}
    a.home{display:inline-block;margin-top:18px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#ff6b8a,#ff416c);color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <h1>Yay! 💖 Happy Valentine!</h1>
    <div class="confetti" aria-hidden="true">🎉 🎈 🌹</div>
    <a class="home" href="index.html" aria-label="Back to question">Back</a>
  </div>
</body>
</html>
